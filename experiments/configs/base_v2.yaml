# Version 2 design (user request 2026-09-16): smaller circuit, food/obstacle sensors without
# look-ahead search, fitness = food and survival only (no board-filling / win terms).
model: connectome
circuit: A_vpn_dn_130
feature_set: v2_full     # v2_full (15) | v2_no_rays (10)
rho: 0.9
k_in: 8
k_out: 8
T: 10
grid: 10
timeout_k: 2
generations: 100000
popsize: 16
games_per_eval: 4
sigma0: 0.5
cma_diagonal: false
val_every: 10
val_games: 32
test_games: 500
fitness: {food: 1.0, fill: 0.0, win: 0.0, timeout: 5.0}
max_train_steps: 2000000
